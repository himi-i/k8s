apiVersion: batch/v1
kind: Job
metadata:
  name: model-downloader
  namespace: ai-inference
  annotations:
    argocd.argoproject.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: downloader
          image: ikdamservice/k8s-project:latest
          env:
            # 컨테이너 env로 지정 -> Python import 이전에 이미 확정되므로 확실하게 적용됨
            - name: HF_HOME
              value: "/model-cache"
          command: ["python", "-c"]
          args:
            - |
              import os
              from transformers import pipeline

              cache_dir = os.environ["HF_HOME"]
              ready_marker = "/model-cache/.model_ready"

              if os.path.isfile(ready_marker):
                  print(f"[model-downloader] {ready_marker} exists, skipping download")
              else:
                  print("[model-downloader] not found, downloading...")
                  pipeline("sentiment-analysis", model="distilbert-base-uncased-finetuned-sst-2-english")
                  with open(ready_marker, "w") as f:
                      f.write("ok")
                  print("[model-downloader] download complete, marker written")
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache-pvc
