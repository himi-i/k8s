apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-service
  namespace: ai-inference
  labels:
    app: inference-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference-service
  template:
    metadata:
      labels:
        app: inference-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # --- Gatekeeper Pod Security 정책 체계 준수 ---
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # 모델 다운로드는 model-downloader Job이 담당(ArgoCD sync-wave -1).
      # 이 initContainer는 다운로드를 하지 않고, PV에 모델이 준비될 때까지
      # "대기"만 한다 -> 네트워크 접근이 필요 없어서 NetworkPolicy 예외가 필요 없음.
      initContainers:
        - name: wait-for-model
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "Waiting for model cache to be populated..."
              i=0
              until [ -f /model-cache/.model_ready ]; do
                i=$((i+1))
                if [ "$i" -gt 60 ]; then
                  echo "Timed out waiting for model cache (model-downloader Job이 끝났는지 확인 필요)"
                  exit 1
                fi
                sleep 2
              done
              echo "Model cache is ready."
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

      containers:
        - name: inference
          # GitHub Actions(Docker Image CI)가 main 브랜치 push 시 자동 빌드/push함
          image: ikdamservice/k8s-project:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MAX_QUEUE_DEPTH
              value: "40"
            - name: STARTUP_DELAY_SECONDS
              value: "0"
            # 모델을 PV에서 읽도록 지정 (더 이상 이미지 내부 캐시 아님)
            - name: HF_HOME
              value: "/model-cache"
            # 혹시라도 huggingface 라이브러리가 최신 버전 확인하러 네트워크를 타지 않도록 강제
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /readyz
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]

      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache-pvc
            readOnly: true
