# 2) 해당 도메인 A 레코드를 fw-01의 외부 IP(34.47.76.134)로 지정
#    (fw-01이 인그레스 트래픽의 진입점이 되도록 포트포워딩/방화벽 룰 구성)
# 3) letsencrypt-staging 으로 먼저 발급 검증 후 letsencrypt-prod ClusterIssuer로 전환
