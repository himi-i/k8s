apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inference-service
  namespace: ai-inference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inference-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30

# 참고: inference_queue_depth 커스텀 메트릭으로 스케일링하려면
# prometheus-adapter를 설치하고 metrics 항목에 Pods/External 타입을 추가하면 됨.
# (Prometheus Adapter 도입은 "AI 인프라 오토스케일링" 심화 포인트로 별도 확장 가능)
